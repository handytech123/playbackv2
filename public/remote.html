<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Playback Remote</title>
  <link rel="stylesheet" href="/remote.css">
</head>
<body>
  <main class="remote-shell">
    <header class="top-bar">
      <div class="compact-readout">
        <strong id="tempoReadout">--</strong>
        <span id="timeSigReadout">--</span>
      </div>
      <div class="time-readout">
        <strong id="transportTime">0:00.00</strong>
        <span id="durationReadout">0:00 / 0:00</span>
      </div>
      <button id="padButton" class="top-command pad" type="button" data-command="togglePad">Pad</button>
      <button class="top-command" type="button" data-command="seek">|&lt;</button>
      <button id="playPauseButton" class="top-command play" type="button" data-command="play">Play</button>
      <button class="top-command" type="button" data-command="fadeOut">Fade</button>
      <button class="top-command danger" type="button" data-command="panic">Panic</button>
      <button id="exitPanicButton" class="top-command recover" type="button" data-command="exitPanic">Recover</button>
      <div id="connectionStatus" class="status-pill offline">Offline</div>
    </header>

    <section id="panicPanel" class="panic-panel hidden">
      <div>
        <strong>Panic Active</strong>
        <span>Tracks Down / Click Alive / Scheduled Cues Suppressed</span>
      </div>
    </section>

    <section class="setlist-strip">
      <div class="setlist-title">
        <span id="modeStatus">Mode --</span>
        <strong>Current Set</strong>
      </div>
      <div id="setlistCards" class="setlist-cards"></div>
      <div id="transitionReadout" class="transition-readout">
        <strong id="transitionNext">Next: --</strong>
        <span id="transitionMode">Transition: --</span>
        <span id="transitionPad">Pad: --</span>
      </div>
    </section>

    <section id="wavePanel" class="wave-panel">
      <div class="wave-status">
        <span id="transportState">--</span>
        <strong id="songTitle">No song selected</strong>
        <span id="songMeta">Waiting for playback computer</span>
      </div>
      <canvas id="waveCanvas" width="1200" height="180" aria-label="Live waveform position"></canvas>
      <div id="wavePlayhead" class="wave-playhead"></div>
      <div id="waveRegionLabel" class="wave-region-label">--</div>
      <div id="waveRecoveryBar" class="wave-recovery-bar hidden">
        <span id="panicRecoveryTarget">Choose recovery target below</span>
        <button class="panic-recover-next" type="button" data-command="exitPanic">Recover Next</button>
      </div>
    </section>

    <section class="command-grid live">
      <button class="command warn" type="button" data-region-command="repeatRegion">Repeat 1</button>
      <button class="command warn" type="button" data-region-command="loopRegion">Loop</button>
      <button class="command" type="button" data-command="goOnRegion">Go On</button>
      <button class="command" type="button" data-command="songTransition">Cue Next</button>
      <button class="command" type="button" data-command="stop">Stop</button>
    </section>

    <section class="sections-panel">
      <div class="panel-title">
        <strong>Sections</strong>
        <span id="sectionHint">tap to queue jump</span>
      </div>
      <div id="regionButtons" class="region-buttons"></div>
    </section>

    <footer class="remote-footer">
      <span id="currentRegion">Current --</span>
      <span id="nextRegion">Next --</span>
      <span id="lastMessage">Ready</span>
    </footer>
  </main>
  <script src="/remote.js?v=20260726-sync-1"></script>
</body>
</html>
